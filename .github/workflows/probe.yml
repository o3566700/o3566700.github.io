name: probe (temporary)
on:
  push:
    branches: [claude/cloud-credits-quota-usage-4rcvj7]
    paths: [scripts/shop_deals.py, .github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/shop_deals.py
      - run: |
          python3 - <<'PY'
          import json, collections
          d = json.load(open("deals/shop.json"))
          print("errors:", d["errors"])
          print(collections.Counter((i["site"], i["cat"]) for i in d["items"]))
          for i in d["items"][:15] + [x for x in d["items"] if x["site"] == "momo"][:10]:
              print(i["site"], i["cat"], i["price"], i["ori"], i["low"], i["off"], i["name"][:45], "|", i["sub"][:30], "|", i["img"][:60])
          PY
