name: PTT Lifeismoney

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write

concurrency:
  group: lifeismoney
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PTT Lifeismoney
        run: python scripts/ptt_lifeismoney.py
        continue-on-error: true
      - name: PChome / momo 3C deals
        run: python scripts/shop_deals.py
        continue-on-error: true
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deals/*.json
          git diff --cached --quiet && exit 0
          git commit -m "Update deals data"
          git pull --rebase
          git push
